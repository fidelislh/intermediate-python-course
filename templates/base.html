<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Questões: Conhecimento Específico - Engenheiro Eletricista</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
        }
        .recycling-border {
            background-image: linear-gradient(to right, #006400 33%, transparent 33%, transparent 66%, #006400 66%);
            background-size: 15px 3px;
            background-repeat: repeat-x;
        }
        .icon-container {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .questao-box, .resposta-box {
            background-color: #F0FFF0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .explicacao-box {
            background-color: #F0F8FF;
            border-radius: 8px;
            padding: 16px;
        }
        .topico-title {
            background-color: #2c5282;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- Slide 1: Título -->
    <div class="slide-container bg-white flex flex-col items-center justify-center p-10">
        <div class="recycling-border w-full h-3 mb-8"></div>
        <div class="flex justify-center space-x-24 mb-10">
            <div class="icon-container bg-blue-100 text-blue-800">
                <i class="fas fa-bolt text-4xl"></i>
            </div>
            <div class="icon-container bg-green-100 text-green-800">
                <i class="fas fa-cog text-4xl"></i>
            </div>
            <div class="icon-container bg-blue-100 text-blue-800">
                <i class="fas fa-plug text-4xl"></i>
            </div>
        </div>
        <h1 class="text-5xl font-bold text-green-800 mb-4 text-center">Questões de Engenharia Elétrica</h1>
        <h2 class="text-4xl font-semibold text-blue-900 mb-10 text-center">Conhecimento Específico por Tópicos</h2>
        <div class="mb-12">
            <h3 class="text-2xl font-medium text-gray-700 text-center">Prova Objetiva - Engenheiro Eletricista</h3>
            <div class="w-48 h-1 bg-green-600 mx-auto mt-2"></div>
        </div>
        <div class="flex items-center justify-center space-x-4 mt-4">
            <div class="flex items-center text-gray-600">
                <i class="far fa-calendar-alt mr-2"></i>
                <span>Prova de 2008</span>
            </div>
            <div class="h-4 w-px bg-gray-400"></div>
            <div class="flex items-center text-gray-600">
                <i class="fas fa-graduation-cap mr-2"></i>
                <span>Universidade Federal do Paraná</span>
            </div>
        </div>
        <div class="recycling-border w-full h-3 mt-auto"></div>
    </div>

    <!-- CONTENT -->

</body>
</html>
